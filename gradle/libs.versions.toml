[versions]
agp = "8.5.0"
javapoet = "1.13.0"
kotlin = "1.9.25"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.2"
hilt = "2.51.1"
compose = "1.7.3"
compose-activity = "1.9.2"
material3 = "1.3.0"
composeCompiler="1.5.15"
ktor_version="2.3.12"
ch_logback = "1.4.14"
serialization = "1.5.1"
hilt_compose = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-material3 = { module = "androidx.compose.material3:material3" ,version.ref="material3" }
androidx-ui = { module = "androidx.compose.ui:ui" ,version.ref="compose" }
androidx-compose = { module = "androidx.activity:activity-compose" ,version.ref="compose-activity"}
javapoet = { module = "com.squareup:javapoet", version.ref = "javapoet" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
dagger-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
dagger-hilt-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt_compose" }
composeCompiler = { module = "androidx.compose.compiler:compiler", version.ref = "composeCompiler" }
kotlin-ktor-client-core = {module="io.ktor:ktor-client-core", version.ref="ktor_version"}
kotlin-ktor-client-cio = {module="io.ktor:ktor-client-cio", version.ref="ktor_version"}
kotlin-ktor-client-serialization = {module="io.ktor:ktor-serialization-kotlinx-json", version.ref="ktor_version"}
kotlin-ktor-client-websockets = {module="io.ktor:ktor-client-websockets", version.ref="ktor_version"}
kotlin-ktor-client-logging = {module="io.ktor:ktor-client-logging", version.ref="ktor_version"}
kotlin-ktor-client-content-negotiation = {module="io.ktor:ktor-client-content-negotiation", version.ref="ktor_version"}
ch-logback = {module="ch.qos.logback:logback-classic", version.ref="ch_logback"}
kotlinx-serialization = {group="org.jetbrains.kotlinx",name="kotlinx-serialization-json", version.ref="serialization"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlinx-serializable = {id="org.jetbrains.kotlin.plugin.serialization",version.ref = "kotlin"}
kapt = {id = "kotlin-kapt"}

